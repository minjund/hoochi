[package]
name = "hoochi"
version = "0.1.41"
description = "Sandwich anything around Claude Code's lifecycle"
authors = ["minjund"]
license = "MIT"
repository = "https://github.com/minjund/hoochi"
edition = "2021"
rust-version = "1.77"

[lib]
name = "hoochi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
toml_edit = "0.22"
libc = "0.2"
tauri = { version = "2.12.6", features = ["macos-private-api", "tray-icon", "image-png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
